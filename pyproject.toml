# Custom Component pyproject.toml - Simplified with healthy defaults

[project]
name = "netzbremse_routemonitor"
version = "0.0.0"   # Version is managed in manifest.json only
requires-python = ">=3.13.2"

[tool.setuptools]
packages = ["custom_components.netzbremse_routemonitor"]

# ============================================================================
# Ruff: Modern Python linter (replaces flake8, isort, pyupgrade, etc.)
# ============================================================================
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Use Ruff's recommended defaults - no need to specify 100+ rules
# This enables: pycodestyle (E, W), pyflakes (F), isort (I), and common best practices
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is fine in tests
    "D",     # Docstrings not required in tests
]

# ============================================================================
# Pyright: Type checker with basic, practical defaults
# ============================================================================
[tool.pyright]
include = ["custom_components/netzbremse_routemonitor"]
exclude = ["**/node_modules", "**/__pycache__", "**/venv", "**/.venv", "**/config"]
venvPath = ".local"
venv = "ha-venv"
typeCheckingMode = "basic"

# ============================================================================
# Pytest: Testing framework
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.coverage.run]
source = ["custom_components/netzbremse_routemonitor"]
omit = ["tests/*"]
